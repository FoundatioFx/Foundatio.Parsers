name: Production query contract

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build/**'
      - 'global.json'
      - '*.slnx'
      - '.editorconfig'
      - 'docs/guide/production-query-contract.md'
      - '.github/workflows/production-query-contract.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'build/**'
      - 'global.json'
      - '*.slnx'
      - '.editorconfig'
      - 'docs/guide/production-query-contract.md'
      - '.github/workflows/production-query-contract.yml'

permissions:
  contents: read

concurrency:
  group: production-query-contract-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contract:
    name: Production contract on Elasticsearch ${{ matrix.elasticsearch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        elasticsearch: ['8.19.0', '9.5.0']
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Record exact inputs
        run: |
          mkdir -p contract-results/inputs
          git rev-parse HEAD HEAD^{tree} | tee contract-results/revision.txt
          curl --fail --silent --show-error http://localhost:9200/ | tee contract-results/elasticsearch.json
          cp tests/compatibility/production-* contract-results/inputs/
          sha256sum tests/compatibility/production-* | tee contract-results/input-sha256.txt
      - name: Test evidence verifier
        run: python3 -m unittest discover -s tests/compatibility -p test_verify_production_contract.py -v 2>&1 | tee contract-results/verifier.log
      - name: Build solution
        run: dotnet build Foundatio.Parsers.slnx --configuration Release | tee contract-results/build.log
      - name: Execute production contract
        run: >-
          dotnet tests/Foundatio.Parsers.ElasticQueries.Tests/bin/Release/net10.0/Foundatio.Parsers.ElasticQueries.Tests.dll
          -class '*ProductionQueryContractTests' -failSkips
          -xml "$GITHUB_WORKSPACE/contract-results/contract.xml"
          | tee contract-results/contract.log
      - name: Verify complete case and configuration inventory
        if: ${{ !cancelled() }}
        run: python3 tests/compatibility/verify_production_contract.py contract-results/contract.xml tests/compatibility | tee contract-results/completeness.log
      - name: Verify contract C# whitespace
        if: ${{ !cancelled() }}
        run: >-
          dotnet format whitespace . --folder --verify-no-changes --verbosity diagnostic
          --include tests/Foundatio.Parsers.ElasticQueries.Tests/ProductionQueryContractFixture.cs
          tests/Foundatio.Parsers.ElasticQueries.Tests/ProductionQueryContractTests.cs
          | tee contract-results/format.log
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-query-contract-${{ matrix.elasticsearch }}
          path: contract-results
          retention-days: 14
          if-no-files-found: error
