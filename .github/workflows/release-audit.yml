name: PR 282 prefix regression audit
on:
  push:
    branches: [audit/pr-282-release-verification]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: a8806641a57859c50108433be81eddb40386d76f
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build regression candidate
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          dotnet build Foundatio.Parsers.slnx -c Release 2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
      - name: Reproduce prefix collision
        run: |
          dotnet tests/Foundatio.Parsers.ElasticQueries.Tests/bin/Release/net10.0/Foundatio.Parsers.ElasticQueries.Tests.dll -class Foundatio.Parsers.ElasticQueries.Tests.OrderingPrefixCollisionTests -failSkips -xml "$RUNNER_TEMP/evidence/tests.xml" 2>&1 | tee "$RUNNER_TEMP/evidence/tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prefix-regressions-before-fix
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 7
