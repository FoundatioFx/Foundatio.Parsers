name: PR 282 final correctness audit
on:
  push:
    branches: [audit/pr-282-release-verification]
permissions:
  contents: read
concurrency:
  group: pr282-final-audit
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        mode: [standalone, integrated]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANDIDATE: 2b01579c9f622e6bb551eb2fca96248b8e45fe45
      PR277: b62ce83b24ffbe3d5ba8d9eb11ec440ddd2610e5
      PR270: 4e37c7fe93e517575a744cecd79a6d631e80e0ac
      EVIDENCE: /tmp/pr282-evidence
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 2b01579c9f622e6bb551eb2fca96248b8e45fe45
          fetch-depth: 0
          persist-credentials: false
      - name: Initialize evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/candidate-sha.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE/candidate-tree.txt"
          git merge-base --is-ancestor 7b7fee4f93497335296f97d62da461065875ec74 HEAD
      - name: Integrate related PRs only in the runner
        if: matrix.mode == 'integrated'
        run: |
          set -euo pipefail
          git config user.name 'Release audit'
          git config user.email 'audit@localhost'
          python - <<'PY'
          import os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True)
          for ref in (os.environ['PR277'], os.environ['PR270']):
              result = subprocess.run(['git', 'merge', '--no-ff', '-m', 'Audit integration ' + ref, ref])
              if result.returncode == 0:
                  continue
              conflicts = git('diff', '--name-only', '--diff-filter=U').splitlines()
              assert conflicts and set(conflicts) <= {'docs/guide/visitors.md', 'docs/guide/query-syntax.md'}, conflicts
              for file in conflicts:
                  text = git('show', ref + ':' + file)
                  if file.endswith('visitors.md'):
                      start = text.index('#### Ordering contexts interpret these operators differently')
                      end = text.index('### Node Data Dictionary', start)
                      section = '''#### Ordering contexts interpret these operators differently

          Sort and aggregation expressions accept explicit `+` and `-` direction prefixes, not Boolean negation.

          - **Sort**: standalone `field` and `+field` are ascending; `-field` is descending. Terms can inherit group direction, so `-(price name +rank)` yields descending, descending, ascending.
          - **Aggregations**: `CombineAggregationsVisitor` reads the sub-aggregation's `+` or `-` prefix directly.
          - **Boolean negation**: the built-in string pipeline rejects `NOT` and `!`, including prefixes consumed and overridden on the opposite side of a colon. Lower-level AST builders do not rerun validation. See [Ordering Operators](./validation#ordering-operators).

          Do not use `IsExcluded()` to interpret sort or aggregation direction.

          '''
                      text = text[:start] + section + text[end:]
                  else:
                      warning = '''::: warning Ordering expressions
          In sort and aggregation expressions, use `+` or `-` for direction. Boolean `NOT` and `!` are rejected, including conflicting prefixes on opposite sides of a colon. Search-query semantics are separate. See [Ordering Operators](./validation#ordering-operators).
          :::

          '''
                      assert '## Grouping' in text
                      text = text.replace('## Grouping', warning + '## Grouping', 1)
                  Path(file).write_text(text)
              subprocess.run(['git', 'add', *conflicts], check=True)
              subprocess.run(['git', 'commit', '-m', 'Resolve audited documentation overlap'], check=True)
          path = Path('docs/guide/syntax-compatibility.md')
          text = path.read_text()
          text += '''
          ## Ordering expressions are a separate contract

          The built-in sort and aggregation string APIs accept explicit `+` and `-` directions and reject Boolean `NOT` and `!`. A direction prefix cannot hide a consumed Boolean prefix (`!max:+price`, `+max:!(price)`, or `!@include:+ordering`). This is a behavioral breaking change; it does not change search-query prefix precedence or fix the query-semantic differences above. Validate the original string rather than a canonicalized round trip. See [ordering validation and migration](./validation#ordering-operators).
          '''
          path.write_text(text)
          subprocess.run(['git', 'add', str(path)], check=True)
          subprocess.run(['git', 'commit', '-m', 'Reconcile ordering and search compatibility documentation'], check=True)
          PY
          git diff "$CANDIDATE" -- docs > "$EVIDENCE/integration-docs.patch"
      - name: Record exact source
        run: |
          git rev-parse HEAD > "$EVIDENCE/tested-sha.txt"
          git rev-parse HEAD^{tree} > "$EVIDENCE/tested-tree.txt"
          git log -12 --oneline > "$EVIDENCE/commits.txt"
          git diff --check
          git archive --format=tar.gz HEAD > "$EVIDENCE/tested-source.tar.gz"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Release build
        id: build
        run: |
          set -euo pipefail
          dotnet --info > "$EVIDENCE/dotnet-info.txt"
          dotnet build Foundatio.Parsers.slnx -c Release 2>&1 | tee "$EVIDENCE/build.log"
      - name: Full semantic formatter verification
        id: format
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          dotnet format Foundatio.Parsers.slnx --no-restore --verify-no-changes --verbosity diagnostic 2>&1 | tee "$EVIDENCE/format.log"
          if grep -q 'Warnings were encountered while loading the workspace' "$EVIDENCE/format.log"; then exit 1; fi
      - name: All prefix collision regressions
        id: regression
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          dotnet tests/Foundatio.Parsers.ElasticQueries.Tests/bin/Release/net10.0/Foundatio.Parsers.ElasticQueries.Tests.dll -class Foundatio.Parsers.ElasticQueries.Tests.OrderingPrefixCollisionTests -failSkips -xml "$EVIDENCE/regressions.xml" 2>&1 | tee "$EVIDENCE/regressions.log"
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          a = ET.parse(os.environ['EVIDENCE'] + '/regressions.xml').getroot().find('assembly')
          assert a is not None and int(a.get('total')) == 292, ET.tostring(a)
          assert int(a.get('passed')) == 292 and int(a.get('failed')) == 0 and int(a.get('errors')) == 0 and int(a.get('skipped')) == 0, a.attrib
          PY
      - name: Locked strict documentation build
        id: docs
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cp docs/.vitepress/config.ts "$RUNNER_TEMP/original-config.ts"
          trap 'cp "$RUNNER_TEMP/original-config.ts" docs/.vitepress/config.ts' EXIT
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/.vitepress/config.ts')
          s = p.read_text()
          assert 'ignoreDeadLinks: true' in s or 'ignoreDeadLinks: false' in s
          p.write_text(s.replace('ignoreDeadLinks: true', 'ignoreDeadLinks: false'))
          PY
          (cd docs && npm ci && npm run build) 2>&1 | tee "$EVIDENCE/docs.log"
      - name: Package and inspect contents without publishing
        id: pack
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          dotnet pack Foundatio.Parsers.slnx -c Release --no-build -o "$RUNNER_TEMP/packages" 2>&1 | tee "$EVIDENCE/pack.log"
          python - <<'PY' | tee "$EVIDENCE/package-contents.txt"
          import os, zipfile
          from pathlib import Path
          packages = list(Path(os.environ['RUNNER_TEMP'], 'packages').glob('*.nupkg'))
          assert len(packages) == 3, packages
          for p in sorted(packages):
              with zipfile.ZipFile(p) as z:
                  names = z.namelist()
                  assert 'README.md' in names and 'foundatio-icon.png' in names
                  assert len([n for n in names if n.endswith('.nuspec')]) == 1
                  project = 'Foundatio.Parsers.' + ('SqlQueries' if '.SqlQueries.' in p.name else 'ElasticQueries' if '.ElasticQueries.' in p.name else 'LuceneQueries')
                  for tfm in (['net10.0'] if '.SqlQueries.' in p.name else ['net8.0', 'net10.0']):
                      for suffix in ('.dll', '.xml'):
                          assert f'lib/{tfm}/{project}{suffix}' in names, (p, names)
                  print(p.name + '\n' + '\n'.join(names))
          PY
      - name: Start Elasticsearch and SQL Server
        id: services
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          docker compose up -d elasticsearch sqlserver 2>&1 | tee "$EVIDENCE/services.log"
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:9200/_cluster/health | grep -Eq '"status":"(green|yellow)"'; then break; fi
            test "$i" -lt 90
            sleep 2
          done
          for i in $(seq 1 90); do
            if docker compose exec -T sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'P@ssword1' -C -Q 'SELECT 1' >/dev/null 2>&1; then break; fi
            test "$i" -lt 90
            sleep 2
          done
          curl --fail --silent http://localhost:9200/ > "$EVIDENCE/elasticsearch-version.json"
          docker compose images > "$EVIDENCE/service-images.txt"
      - name: Full solution test assemblies with native XML
        id: tests
        if: ${{ !cancelled() && steps.services.outcome == 'success' }}
        run: |
          set -euo pipefail
          for project in LuceneQueries ElasticQueries SqlQueries; do
            dotnet "tests/Foundatio.Parsers.$project.Tests/bin/Release/net10.0/Foundatio.Parsers.$project.Tests.dll" -failSkips -xml "$EVIDENCE/full-$project.xml" 2>&1 | tee "$EVIDENCE/full-$project.log"
          done
          python - <<'PY' | tee "$EVIDENCE/test-totals.txt"
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path(os.environ['EVIDENCE']).glob('full-*.xml'))
          assert len(reports) == 3
          total = 0
          for p in sorted(reports):
              a = ET.parse(p).getroot().find('assembly')
              assert a is not None and int(a.get('total')) > 0
              assert int(a.get('failed')) == 0 and int(a.get('errors')) == 0 and int(a.get('skipped')) == 0 and int(a.get('not-run', '0')) == 0, a.attrib
              assert int(a.get('total')) == int(a.get('passed')), a.attrib
              total += int(a.get('total'))
              print(p.name, a.attrib)
          assert total >= 1298, total
          print('FULL TOTAL:', total)
          PY
      - name: .NET 8 ordering runtime regressions
        id: net8
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && matrix.mode == 'standalone' }}
        run: |
          set -euo pipefail
          for project in LuceneQueries ElasticQueries; do
            dotnet build "tests/Foundatio.Parsers.$project.Tests/Foundatio.Parsers.$project.Tests.csproj" -c Release -p:ReferenceFoundatioSource=false -p:TargetFrameworks=net8.0 2>&1 | tee "$EVIDENCE/net8-build-$project.log"
            dotnet "tests/Foundatio.Parsers.$project.Tests/bin/Release/net8.0/Foundatio.Parsers.$project.Tests.dll" -class "Foundatio.Parsers.$project.Tests.Ordering*" -failSkips -xml "$EVIDENCE/net8-$project.xml" 2>&1 | tee "$EVIDENCE/net8-$project.log"
          done
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          total = 0
          for p in Path(os.environ['EVIDENCE']).glob('net8-*.xml'):
              a = ET.parse(p).getroot().find('assembly')
              assert int(a.get('total')) > 0 and int(a.get('total')) == int(a.get('passed')) and int(a.get('errors')) == 0, a.attrib
              total += int(a.get('total'))
          assert total == 354, total
          PY
      - name: Mutation control proves the tests expose the original defect
        id: mutation
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && matrix.mode == 'standalone' }}
        run: |
          set -euo pipefail
          paths=(src/Foundatio.Parsers.LuceneQueries/LuceneQueryParser.cs src/Foundatio.Parsers.LuceneQueries/LuceneQueryParser.peg src/Foundatio.Parsers.LuceneQueries/Visitors/ValidationVisitor.cs)
          trap 'git restore --source="$CANDIDATE" --staged --worktree -- "${paths[@]}"' EXIT
          git restore --source=69d385f51b4af7e5d6c90e23c09e9ed6589620a5 --staged --worktree -- "${paths[@]}"
          git diff HEAD -- "${paths[@]}" > "$EVIDENCE/mutation.patch"
          dotnet build Foundatio.Parsers.slnx -c Release 2>&1 | tee "$EVIDENCE/mutation-build.log"
          set +e
          dotnet tests/Foundatio.Parsers.ElasticQueries.Tests/bin/Release/net10.0/Foundatio.Parsers.ElasticQueries.Tests.dll -class Foundatio.Parsers.ElasticQueries.Tests.OrderingPrefixCollisionTests -failSkips -xml "$EVIDENCE/mutation.xml" 2>&1 | tee "$EVIDENCE/mutation.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          a = ET.parse(os.environ['EVIDENCE'] + '/mutation.xml').getroot().find('assembly')
          assert int(a.get('total')) == 292 and int(a.get('failed')) == 28 and int(a.get('passed')) == 264 and int(a.get('errors')) == 0 and int(a.get('skipped')) == 0, a.attrib
          print('Expected original-defect failures confirmed:', a.attrib)
          PY
      - name: Capture final worktree and step outcomes
        if: always()
        env:
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p "$EVIDENCE"
          printf '%s\n' "$STEP_OUTCOMES" > "$EVIDENCE/outcomes.json"
          git diff HEAD > "$EVIDENCE/final-worktree.diff"
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr282-final-${{ matrix.mode }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: 14
